# Copy this file to config.ini and edit it.  config.ini is ignored by git, so your token stays local.

[monitor]
# Main loop period in seconds: w32time status is read every loop.
loop_seconds = 5

[servers]
# NTP server = how often to poll it, in seconds.  The first server is your primary (local) server.
# Poll public servers sparingly (7200 s or more) or they may block you.
192.168.1.10 = 5          # replace with your local NTP server
time.windows.com = 7200
time.aws.com = 7200
time.google.com = 7200

[influxdb]
# InfluxDB 2.x.  Leave token empty to print results only.
# INFLUX_URL, INFLUX_ORG, INFLUX_BUCKET and INFLUX_TOKEN environment variables override these.
url = http://localhost:8086
org = my-org
bucket = ClockMetrics
token =
